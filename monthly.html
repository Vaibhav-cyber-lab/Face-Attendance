{% extends "base.html" %}{% block content %}<div class="card"><h1>Monthly report</h1><form><label>Month</label><input type="month" name="month" value="{{month}}"><button>View</button></form><a class="btn" href="/reports/export?month={{month}}">Download CSV</a><p class="muted">Estimated weekdays × 7 periods; holidays are not excluded.</p><div style="overflow:auto"><table><tr><th>Roll</th><th>Name</th><th>Attended</th><th>Scheduled estimate</th><th>Percentage</th></tr>{% for r in report %}<tr><td>{{r.roll}}</td><td>{{r.name}}</td><td>{{r.attended}}</td><td>{{r.scheduled}}</td><td>{{r.pct}}%</td></tr>{% endfor %}</table></div></div>{% endblock %}
