{% extends "base.html" %}{% block content %}<div class="card"><h1>WhatsApp reports</h1><form><label>Month</label><input type="month" name="month" value="{{month}}"><button>Prepare links</button></form><p>Links open a prefilled message; a teacher must press Send. Messages are not automatic.</p><table><tr><th>Name</th><th>Phone</th><th>Action</th></tr>{% for l in links %}<tr><td>{{l.name}}</td><td>{{l.phone}}</td><td><a href="{{l.url}}" target="_blank" rel="noopener">Open WhatsApp</a></td></tr>{% endfor %}</table></div>{% endblock %}
