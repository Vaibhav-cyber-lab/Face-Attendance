<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Face Attendance</title>
<style>body{font-family:system-ui;margin:0;background:#f3f6fb;color:#172033}header{background:#172554;color:white;padding:15px}header a{color:white;margin-right:10px}main{max-width:1000px;margin:20px auto;padding:0 12px}.card{background:white;border:1px solid #dbe3ef;border-radius:12px;padding:16px;margin:14px 0}input,button{font:inherit;padding:9px;border:1px solid #bbc6d6;border-radius:7px;max-width:100%}input{display:block;width:100%;box-sizing:border-box;margin:5px 0 12px}button,.btn{background:#1d4ed8;color:white;border:0;padding:10px 13px;border-radius:7px;text-decoration:none;display:inline-block}table{border-collapse:collapse;width:100%}td,th{text-align:left;border-bottom:1px solid #e5eaf2;padding:8px}video{width:100%;max-width:640px;background:#111;border-radius:10px}.flash{background:#fff1c2;padding:10px;border-radius:7px;margin:8px 0}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}.muted{color:#64748b}</style></head><body><header><b>Face Attendance</b> &nbsp; <a href="/">Home</a> <a href="/student">Student lookup</a>{% if session.get('admin') %}<a href="/camera">Mark attendance</a> <a href="/attendance">Daily</a> <a href="/reports/monthly">Monthly</a> <a href="/whatsapp">WhatsApp</a> <a href="/logout">Logout</a>{% else %}<a href="/login">Teacher login</a>{% endif %}</header><main>{% for m in get_flashed_messages() %}<div class="flash">{{m}}</div>{% endfor %}{% block content %}{% endblock %}</main></body></html>
