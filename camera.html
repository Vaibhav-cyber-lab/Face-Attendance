{% extends "base.html" %}{% block content %}<div class="card"><h1>Mark attendance</h1><p>Active period: <b>{{period or "None — outside timetable"}}</b></p><p class="muted">Allow camera access and show one registered face at a time. HTTPS is required for mobile camera access.</p><video id="v" autoplay playsinline muted></video><canvas id="c" hidden></canvas><p><button id="start">Start camera</button> <button id="stop">Stop camera</button></p><div class="card" id="status">Camera stopped.</div></div>
<script>let stream=null,timer=null,busy=false;const v=document.getElementById('v'),c=document.getElementById('c'),s=document.getElementById('status');document.getElementById('start').onclick=async()=>{try{stream=await navigator.mediaDevices.getUserMedia({video:{facingMode:'user'}});v.srcObject=stream;s.textContent='Camera running…';timer=setInterval(send,2000)}catch(e){s.textContent='Camera error: '+e.message}};document.getElementById('stop').onclick=()=>{if(timer)clearInterval(timer);timer=null;if(stream)stream.getTracks().forEach(t=>t.stop());stream=null;s.textContent='Camera stopped.'};async function send(){if(busy||!stream||v.readyState<2)return;busy=true;try{c.width=v.videoWidth;c.height=v.videoHeight;c.getContext('2d').drawImage(v,0,0);let r=await fetch('/api/recognize',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({image:c.toDataURL('image/jpeg',.75)})});let d=await r.json();s.textContent=d.message||'Checking…'}catch(e){s.textContent='Network error'}finally{busy=false}}</script>{% endblock %}
